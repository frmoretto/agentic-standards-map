id: gs1-conformant-resolver
name: GS1-Conformant Resolver Standard 1.2.1
org: GS1
kind: specification
tier: core
status: 'Release 1.2.1 ratified August 2026 (the standard page header reads "Release 1.2.1, Ratfied Aug 2026", the PDF footer "Release 1.2.1, Ratified, Aug 2026"); the archive page on ref.gs1.org lists "Published 19 August 2026", and the previous release 1.2.0 as "Published 16 January 2026". The path of the Resolver Description File, /.well-known/gs1resolver, is in the IANA Well-Known URIs registry with status permanent and controller GS1 (registry updated 2026-10-26, read 2026-10-30).'
status_as_of: 2026-10-30
relevance: >-
  The standard defines how a GS1 Digital Link URI, which carries a product or location key such as a GTIN
  or a Global Location Number (GLN), is resolved to related information sources. It sets its function
  apart from a plain redirect: "A simple 1-to-1 redirect does not require any special software – it's a
  basic function available on all Web servers. However, using a GS1-Conformant Resolver, it is possible
  to link that single entity to multiple sources of related information in a way that is
  machine-discoverable and machine-actionable." (section 1), and it says of itself that it "is based
  entirely on existing standards and techniques defined by the Internet Engineering Task Force (IETF)
  and the World Wide Web Consortium (W3C)". Each link stored in a resolver carries three mandatory
  attributes, the target URL, the link relation type and a title, and may carry the human language, the
  media type and a "context" (section 2.5). The link relation type, "which we abbreviate to link type",
  "SHOULD be given as a URI defined in the GS1 Web vocabulary", written as a compact URI: "the prefix
  gs1: is shorthand for https://ref.gs1.org/voc/ so that gs1:pip expands to https://ref.gs1.org/voc/pip",
  and "GS1-Conformant Resolvers SHALL recognise the link types defined in the gs1: namespace" (sections
  2.5.2 and 2.14; the examples given are gs1:hasRetailers and gs1:allergenInfo; the vocabulary also
  defines gs1:epcisRepository, see gs1-epcis and gs1-web-vocabulary). For each identified entity "there
  SHALL be exactly one default link", typed gs1:defaultLink, and the standard's "cardinal rule" is that
  "Resolvers SHALL redirect to the default link unless there is information in the request that can be
  used to determine a better response", information given in the HTTP request headers (such as Accept
  and Accept-Language) or by the linkType and context query parameters (sections 2.5.8 and 2.6.1); the
  optional link type gs1:defaultLinkMulti "allows a resolver to take note of, for example, a user's
  language preferences to determine which of several available redirects are followed", and "If there
  are no links typed as gs1:defaultLinkMulti, redirect to the gs1:defaultLink" (sections 2.6.1 and
  2.6.3). An application MAY ask for a link type in the query string (the examples are
  linkType=gs1:nutritionalInfo and linkType=gs1:epil): "If the requested type of link is available, the
  resolver SHALL redirect to it", and "If the requested type of link is not available, the resolver SHALL
  return a 404 Not Found message", which the standard notes as "a significant change from GS1 Digital
  Link version 1.1", where the resolver redirected to the default (section 2.6.2). The prose gives no
  status code for the redirect; the flow chart of Figure 2-1 reads "Redirect to default (307)" and
  "Redirect to it (307)". In the resolution rules "The link type is the principal attribute to be taken into account. This is why a 404
  Not Found response is appropriate if a specified link type is not available", and where several links
  of the requested type cannot be told apart "the resolver should return the list of the available links
  of that type with an HTTP response code of 300 Multiple Choices" (section 2.6.3). The linkset "is a set
  of links from an identified entity to one or more sources of information that are directly related to
  it", as defined in RFC 9264; a client requests it with the HTTP Accept header application/linkset+json
  or with linkType=linkset, and then "the resolver SHALL NOT redirect the query and SHALL return the
  linkset"; for a URI with key qualifiers "links are inherited from further up the hierarchy", so a
  request at serial level also returns the links of the batch and of the GTIN (section 2.9). The JSON
  form "SHALL validate against https://ref.gs1.org/standards/resolver/linkset-schema", the response
  "SHOULD include a Link header pointing to a context file so that the JSON can be expanded to JSON-LD"
  (the recommended context is https://ref.gs1.org/standards/resolver/linkset-context), a client that asks
  for application/ld+json SHOULD get the linkset "as JSON-LD with the context definitions included in the
  data", and an HTML answer SHOULD carry the linkset "embedded within the HTML page as JSON-LD" (section
  2.10); resolvers "MAY support the setting of the default linkType to linkset" (section 2.11). The
  context parameter "MAY be used to disambiguate further between multiple links that match the given
  link type", the examples being recipe categories, territories, retailers for availability and price,
  and a regulatory profile of a verification service, and "The value space of the context parameter is
  not defined in this specification and resolvers are not obliged to support it" (section 2.5.6). For a
  request URI that fails the validity tests "the resolver SHALL respond with an HTTP response code of 400
  (Bad Request)", for a valid URI about which the resolver has no information it "SHALL return a simple
  404 Not Found response", and it "SHALL NOT use a 200 OK response code when processing a query that,
  for whatever reason, causes an error condition" (section 2.4.1); the query string "carries attributes
  of the identified entity and does not form part of the entity's identifier" (section 2.12). A
  conformant resolver "SHALL make a Resolver Description File available at /.well-known/gs1resolver"
  (RFC 8615), a file that "provides a machine-readable description of the resolver's capabilities and
  thus allows applications to automatically detect a resolver's capabilities and act accordingly" and
  "explicitly asserts the sovereignty of URLs within its own domain name"; it "SHALL validate against the JSON schema
  published at https://ref.gs1.org/standards/resolver/description-file-schema", requires the properties resolverRoot
  and supportedPrimaryKeys (the allowed values are "all" and GS1 Application Identifiers such as "01",
  "414" and "00"), and may declare a name, further link-type namespaces with their prefixes, whether the
  default link type can be the linkset, the recognised context values and the location of the JSON-LD
  context (section 3). "The presence or absence of this file can be used to determine whether or not
  the URI points to a service conformant to this standard", and "resolvers are not required or expected
  to redirect to the same target resources or return the same linksets as each other" (section 4). The
  revision notes record that earlier versions recommended that resolvers "SHOULD also recognise relevant
  terms in schema.org. This has been removed although, of course, resolvers MAY use such terms."
committed_next: []
boundary: 'Out of scope: identical targets or linksets across resolvers ("resolvers are not required or expected to redirect to the same target resources or return the same linksets as each other", section 4), any particular behaviour for query string parameters ("Implementations MAY make use of query string parameters but this standard does not define a particular behaviour", section 2.12) and the value space of the context parameter (section 2.5.6).'
