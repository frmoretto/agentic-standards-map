org: IETF
kind: work-item
tier: context
status: 'Individual Internet-Draft, not adopted by a Working Group (WG): draft-mozleywilliams-dnsop-dnsaid-02 (2026-05-27) is marked "Replaced" on the datatracker by draft-mozleywilliams-dawn-dnsaid-00 (2026-11-02, Individual Submissions, no stream, expires 2027-05-06; datatracker, read 2026-11-16). Related individual proposals, none adopted by a WG (datatracker, 2026-10-13 and 2026-10-15): draft-ihsanullah-dnsid-01, draft-ferro-dnsop-apertoid-02, draft-morrison-mcp-dns-discovery (revision -10 posted 2026-11-18, datatracker, read 2026-11-23; text of -10 not read), draft-ranjbar-dane-did-01 and draft-ranjbar-dane-anchored-identity-00; the first four are the drafts named by the non-WG list dns-underscore-keys, announced by the IETF Secretariat on 2026-10-09, and DNS-AID is not among them.'
status_as_of: 2026-11-23
relevance: The abstract says the document "standardizes an approach for publishing AI agents in the Domain Name System (DNS) so that other agents can discover them". The draft publishes AI agents in DNS; Section 5.6 reserves SvcParamKeys for "commercial signaling such as cost-per-unit-of-input, unit-of-input definitions, billing tiers, or rate-limit hints".
