evidence:
  read: 'On 2026-11-23: the datatracker records (doc.json) of draft-morrison-mcp-dns-discovery (-10 of 2026-11-18) and draft-shankarlingam-oauth-agent-dns-link (revisions and dates); their texts were not read. On 2026-11-16: the datatracker records (doc.json) of draft-mozleywilliams-dnsop-dnsaid (state Replaced) and draft-mozleywilliams-dawn-dnsaid (revision -00 of 2026-11-02); the text of -00 was not read for this entry. On 2026-10-19: the archive page of the message of 2026-07-11 on the public-credentials list of the W3C, and issue #3 of this repository, in which the addition for draft-ranjbar-dane-did was proposed on 2026-10-15; the draft is not linked in the message. On 2026-10-15: issue #12 of danubetech/did-method-dns (state, comments); the datatracker record of draft-ranjbar-dane-anchored-identity (revision -00, 2026-07-21, Individual Submissions, no stream), which was proposed for the map in issue #2 of this repository (2026-10-15) by its author. On 2026-10-13 also: the datatracker records (revision number and revision date) of the four related drafts, and the three messages of the archive of dns-underscore-keys. On 2026-10-13: the datatracker page (revision -02 of 2026-05-27, "(No stream defined)", expires 28 November 2026); the dnsop documents page was not re-read. Draft -02 text, datatracker page and dnsop documents page, read 2026-10-02; dnsop list (filtered by subject, 2026-08-01 to 2026-09-17) and DAWN list, read 2026-10-03. Status as written in version 1.4, kept here verbatim as the record of earlier readings; the status above replaces it: Individual Internet-Draft -02 (2026-05-27), "(No stream defined)", not adopted by a Working Group (WG); expires 2026-11-28. Related individual proposals, none adopted by a WG (datatracker, 2026-10-13): draft-ihsanullah-dnsid-01 (2026-06-29), draft-ferro-dnsop-apertoid-02 (2026-08-12), draft-morrison-mcp-dns-discovery-08 (2026-10-09; revision -09 posted 2026-10-22, datatracker, read 2026-11-02) and draft-ranjbar-dane-did-01 (2026-08-01), and a fifth, draft-ranjbar-dane-anchored-identity-00 (2026-07-21; datatracker, 2026-10-15); DNS-AID is not among them. The IETF Secretariat announced on 2026-10-09 (15:20 UTC) a non-WG list, dns-underscore-keys (area INT), whose purpose is "To compare existing proposals for publishing keys, or references to them, under underscore labels in DNS" and names those four drafts; its public archive held three messages on 2026-10-13. The first post, by an author of one of the four drafts (2026-10-10), compares them on five axes: who the record is about, where the key sits, what makes the record trustworthy, revocation, and continuity of holding after a domain changes hands; it leaves open the enumeration of names in a zone, record size, and TXT against a new RRTYPE. On 2026-10-12 an author of another of the four wrote that "A 3 1 1 TLSA with SHA-256 is 35 bytes of RDATA" and "The full signed answer with the DO bit set is 271 bytes", measured on one live record (figures declared by the source, not reproduced here). The draft texts were not read for this entry; their content is as the list messages describe it. Status as written in version 1.5, kept verbatim as the record of earlier readings: Individual Internet-Draft, not adopted by a Working Group (WG): draft-mozleywilliams-dnsop-dnsaid-02 (2026-05-27) is marked "Replaced" on the datatracker by draft-mozleywilliams-dawn-dnsaid-00 (2026-11-02, Individual Submissions, no stream, expires 2027-05-06; datatracker, read 2026-11-16). Related individual proposals, none adopted by a WG (datatracker, 2026-10-13 and 2026-10-15): draft-ihsanullah-dnsid-01, draft-ferro-dnsop-apertoid-02, draft-morrison-mcp-dns-discovery (revision -09 posted 2026-10-22, read 2026-11-02), draft-ranjbar-dane-did-01 and draft-ranjbar-dane-anchored-identity-00; the first four are the drafts named by the non-WG list dns-underscore-keys, announced by the IETF Secretariat on 2026-10-09, and DNS-AID is not among them.'
  not_read: A DNS-AID thread under another subject on dnsop; the texts of the four related drafts.
  not_found: 'Adoption call, objection or dated promise for the draft: not found in the lists read, 2026-10-03.'
open_proposals:
- what: 'Issue #12 of danubetech/did-method-dns: make DNSSEC normative (MUST) in did:dns and add an optional DANE/TLSA key binding for verification methods, together with the individual Internet-Draft draft-ranjbar-dane-did-01. On the datatracker the draft is under "Individual Submissions" with no stream and no group (read 2026-10-16). A message of 2026-07-11 on the public-credentials list of the W3C proposes a normative DANE-EE profile that did:web and did:dns could point at; the list dns-underscore-keys compares the draft with three others. The addition for draft-ranjbar-dane-did was proposed for the map in issue #3 (2026-10-15) by an author of that draft, who wrote in it: "For disclosure, I opened the issue below and co-author the draft it refers to."'
  author: a participant
  date: 2026-07-09
  state: open
  url: https://github.com/danubetech/did-method-dns/issues/12
