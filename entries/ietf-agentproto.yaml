id: ietf-agentproto
name: IETF agentproto (Agent Communication Protocols WG)
org: IETF
kind: charter
tier: core
status: 'The Internet Engineering Steering Group (IESG) announced on 2026-10-08, 16:55 UTC, "A new IETF WG has been formed in the Applications and Real-Time Area" for Agent Communication Protocols (agentproto), chairs Orie Steele and Leslie Daigle, and names the responsible Area Director. The datatracker page read on 2026-10-09 shows charter-ietf-agentproto-01, state "Approved", Working Group (WG) state "Active", area Applications and Real-Time Area (art), last updated 2026-10-08, and its history records "Charter approved, group active" on 2026-10-08. Reading of 2026-10-13: the datatracker charter page is still headed "Agent Communication Protocols (agentproto) Proposed Charter" while its state is Approved and the group is Active (charter-ietf-agentproto-01, last updated 2026-10-08). The related drafts page lists 15 drafts, among them the individual Internet-Drafts draft-agentic-ai-usecases-requirements-03 (posted 2026-10-10) and draft-rosenberg-agentproto-usecases-00 (2026-07-04); the datatracker page of the first, read on 2026-10-16, shows revision -04, last updated 2026-10-15. The chairs wrote on the list on 2026-10-12 that "Our goal for this topic is to identify candidate starting points for the Use Cases and Requirements document.", that the discussion "identified two drafts for consideration" (those two) and that "We have useful contributions toward a working group document, but have not yet established which draft should be its starting point." In the same thread an author of the -03 draft proposed, for a -04, the requirements B1-7 (checks on resumption) and B1-8 ("If any check in B1-7 fails or cannot be completed, the dialog is not resumed and the protocol is required to signal the reason."), and CMN-12 ("Before accepting a change to a dialog, a participant is required to be able to verify that the change is authorized at that time."); on 2026-10-13 the same author agreed to add to Section 4.2 "If the outcome cannot be determined, the operation remains unresolved, and resuming the dialog alone does not justify resending it." (proposed text read as quoted in the chairs'' message and in the reply). On 2026-10-12 a chair answered a thread on implementation evidence with "Please refrain from sending messages regarding implementations at this time." A session request for agentproto at IETF 127 exists in the datatracker (requested duration 2:00:00, last modified 2026-10-08); no timeslot assignment for it is found in the agenda schedule of the meeting (API, 2026-10-13). On 2026-10-26 the agenda of IETF 127 on the datatracker schedules the session on Monday 2026-11-16, 14:00 to 16:00 San Francisco time (America/Los_Angeles, UTC-8), room Continental 5. Read 2026-11-09 on the datatracker: draft-agentic-ai-usecases-requirements is at revision -07, published on 2026-11-02 (after -05 of 2026-10-27 and -06 of the same day); on 2026-11-07 the document was moved to the IETF stream in the agentproto group, with the working group state "Candidate for WG Adoption".'
status_as_of: 2026-11-09
relevance: 'The charter ("Agent Communication Protocols") defines an "agentic dialog management protocol" of dialog identifiers, lifecycle semantics and propagation of dialog context, with bindings over existing IETF protocols; it "neither replaces application-layer agent communication protocols nor defines a new transport protocol". Commerce, payment, merchant and purchase: not found in charter 00-04 (saved 2026-10-03). The text of the charter on the datatracker page is still headed "Agent Communication Protocols (agentproto) Proposed Charter". Commerce, payment, merchant, purchase and seller: not found in the charter text of the page (2026-10-09). The coordination section reads "This working group is expected to closely coordinate with other related IETF working groups on dependencies of the reference architecture and the agentic dialog management", and lists five groups of venues: "Security: Web Authorization Protocol (OAuth), webbotauth, WIMSE - on identity, authorization, and security considerations.", "Transport: WebTransport, MoQ, QUIC, TSVWG, httpbis - on data transport.", "Discovery and Operations: INT area, OPS area - on agent discovery and operational considerations.", "Evidence and transparency: SCITT, RATS, on software and hardware security." and "Conversational data: vCon - on conversation representation and its relationship to dialog context." On the list thread "Topic: Existing practice, use cases, and deployment models" Iman Schrock proposed on 2026-10-05 for section 3.3.5 of the use cases text: "If a required authorization input cannot be established, preserve that fact separately from an evaluated refusal, even when both lead to local denial."; Girish Konda wrote the same day "An unestablished input is a different fact from a negative one" and pointed to his individual draft draft-konda-agentproto-evaluation-state-00. On 2026-10-07 a participant wrote, without asking to change or delay 00-04, that "accurately recording that an authorization answer was unavailable is not the same thing as making that fact available to the decision that admits the continuation." On 2026-10-08 the responsible Area Director answered three participants on the list: "I believe this matter is one for the working group rather than the charter", adding "The use cases and requirements deliverable is the right home for the more detailed discussion of requirements and corresponding text."; the Internet Architecture Board (IAB) reviewer wrote the same day "The new charter looks good to me." Charter PR #128 (Mallory Knodel, opened 2026-10-02) was closed without a merge on 2026-10-08; the responsible Area Director commented "The PR is a substantial change very late in the process, and the concerns it aims to address were already handled by other, more targeted" The milestones of charter 01 read "Dec 2026 - Adopt an informational use cases draft", "Feb 2027 - Adopt an informational architecture draft", "Mar 2027 - Adopt proposed standard agentic dialog management protocol draft(s)" and "Mar 2028 - Submit agentic dialog management protocol draft(s) to the IESG as proposed standard".'
