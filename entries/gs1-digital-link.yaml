id: gs1-digital-link
name: GS1 Digital Link Standard, URI Syntax 1.7.0
org: GS1
kind: specification
tier: context
status: 'Release 1.7.0 ratified August 2026 (page header "Release 1.7.0, Ratified Aug 2026"); the archive on ref.gs1.org lists "Published 7 August 2026". The family page says the original standard was "first ratified in August 2018" and keeps it as a legacy document, release 1.1.4 ("Release 1.1.4, Ratified, Dec 2025" on its cover, "Current version published January 2026" on the family page), of which "No further updates are expected for this document".'
status_as_of: 2026-10-30
relevance: >-
  The syntax "distinguishes between primary identification keys that express simple GS1 identifiers,
  such as GTIN and GLN, key qualifiers that express GS1 identifier extensions, such as batch/lot and GLN
  extension (forming compound GS1 identifiers), and attributes that express GS1 informative data such as
  expiry date and ship-to address" (section 1). The primary key and its key qualifiers go in the URI
  path, where the compound identifier "is used to retrieve information about something at a finer level
  of granularity (e.g. traceability data about an serialised GTIN, batch/lot-level master data)"; the
  data attributes go in the query string, which is also "a natural extension point for any additional
  arbitrary key=value pairs that cannot be expressed using GS1 Application Identifiers", for example
  "to indicate a specific stakeholder role or a specific action or activity or type of service to be
  accessed" (section 3). "A GS1 Digital Link URI is a particular form of URL and can be used in exactly
  the same way as any other URL (this is an important design feature). However, it can also be the
  gateway to multiple sources of information, both human and machine-readable", which the
  GS1-Conformant Resolver Standard resolves "in such a way that information systems and apps can
  discover them automatically and selectively via link types and link sets" (section 1; see
  gs1-conformant-resolver). Such a URI, "like any Web URI or URL, does not have any intrinsic meaning";
  only a GS1-aware system extracts the Application Identifiers, and "Applications SHALL NOT assume that
  a URL that follows the syntax defined in this standard will point to a resolver. One way to test
  whether a Web URI does or does not point to a GS1 conformant resolver is to check for the presence of
  a Resolver Description File in the relevant Well-Known location /.well-known/gs1resolver" (section
  1). The canonical form of a URI (RFC 6596) uses HTTPS, "the domain name SHALL be id.gs1.org", no
  deprecated convenience strings for Application Identifiers, and the resolver parameters, "namely
  linkType and context, and their values, are not included in the canonical GS1 Digital Link"; the
  example given turns http://example.com/01/09520123456788/22/2A?linkType=gs1:traceability into
  https://id.gs1.org/01/09520123456788/22/2A (section 4.12). The URI "can be encoded natively in any
  data carrier that can support the encoding of a Web address (URL)", QR Code, Data Matrix, NFC tags
  and digital watermarks among them (section 3), and the syntax "is itself conformant with Encoding
  and resolving identifiers over HTTP [ISO/IEC 18975]" (section 4). The standard names four documents:
  this URI syntax, which "is the foundation on which all other aspects of the standard are built" and
  is, in its words, synonymous with the term GS1 Digital Link; the GS1-Conformant Resolver Standard;
  the Compression Technical Standard for EPC binary strings ("Release 1.0.0, Ratified, Jul 2025" on its
  cover), which "supersedes the compression/decompression algorithm defined in the legacy GS1 Digital
  Link Standard"; and the semantics chapter of the legacy standard, of which it says that the work "has
  evolved to be part of a broader effort to define the semantics or all GS1 Application Identifiers,
  and will be supported in a separate document once completed" (section 1). Its reference list names
  the GS1 Web Vocabulary, the EPC Tag Data Standard, the GS1 General Specifications and the
  GS1-Conformant Resolver Standard (see gs1-web-vocabulary).
