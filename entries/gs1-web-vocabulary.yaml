verified: 2026-11-09
evidence:
  read: 'On 2026-11-09, on ref.gs1.org: the landing page /voc/ ("New terms are developed and ratified according to the Global Standards Management Process"; "JSON-LD context resources (provisional)"), the ontology gs1Voc.jsonld (header: owl:versionInfo "1.18", dct:modified 2026-06-01, dct:issued 2017-11-20, voaf:extends, voaf:specializes and voaf:hasEquivalencesWith schema:; description: "The vocabulary builds on and refers to schema.org where appropriate."), the archive page ("Version 1.18.0 Published 2026-06-01") and changeLog.json (newest entry 1.17.0). Licence: schema:license in the ontology says "Licensed under the Apache License, Version 2.0", with the GS1 IP Policy and RAND notice; the gs1/WebVoc README (read with gh) says the vocabulary "is released under an Apache 2.0 licence". Counts read in gs1Voc.jsonld: 55 terms carry skos:exactMatch to schema:, 30 carry rdfs:subPropertyOf schema:, 557 nodes are typed rdf:Property. owl:equivalentClass on gs1:Product points only to the gs1.org/voc and www.gs1.org/voc forms of its own URI. Proposed in issue #29 of this map''s repository (2026-11-02) by Sven Böckelmann, who wrote: "Disclosure: Co-chair of the GS1 Visibility Standards (EPCIS/CBV) maintenance group; maintainer of OpenEPCIS; CTO at benelog GmbH & Co. KG, which sells EPCIS and Digital Link products." The entry is written from the standards on ref.gs1.org, not from the text proposed in the issue.'
  not_read: 'Not read: gs1Voc.ttl, the two JSON-LD context files (data/GS1-WebVoc-context.jsonld, data/GS1-core-context.jsonld), and www.gs1.org (it refuses this map''s reader).'
  not_found: 'A "Ratified" label with a date for 1.18: not found on the landing page, the archive page, the ontology header or the change log (2026-11-09). An out-of-scope statement: not found on the landing page, the archive page or the ontology header (2026-11-09); the individual term definitions were not read for one.'
