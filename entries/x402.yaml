id: x402
name: x402
org: Linux Foundation
kind: specification
tier: core
status: 'Open payment protocol under the x402 Foundation (Linux Foundation): intent announced 2026-04-02; operational launch and completed contribution by Coinbase announced 2026-07-14, with 40 member organisations at launch. On 2026-10-13 main is at commit 6c470a8 and the core specification header reads "Protocol Version: 2" (specs/x402-specification-v2.md); no release is listed on GitHub (not found, 2026-10-13). The file ROADMAP.md, which read "(update coming soon)" on 2026-10-03, was removed from main on 2026-10-13 by PR #3789, "chore: remove outdated ROADMAP.md and PROJECT-IDEAS.md". Correction: PR #8 of the Domain Discovery working group and PR #2979 of the core repository answered 404 on 2026-11-02, when version 1.3 of this map called them no longer reachable; on 2026-11-09 both are reachable again and open, with the same author; why they were unreachable is not known. Issue #11 of wg-domain-discovery, on the content of `/.well-known/x402`, is open (last comment 2026-10-31); a record of the working group call of 2026-11-02 announced in that thread is not found on GitHub (issue, repository files and the organisation''s repositories, 2026-11-09). PR #4 of the working group, which proposes a small entry at `/.well-known/x402` linking to OpenAPI documents, is open.'
status_as_of: 2026-11-09
relevance: 'The README says "x402 is an open standard for internet native payments."; the server answers 402 with a PAYMENT-REQUIRED header, the client replies with PAYMENT-SIGNATURE, and an http-message-signatures extension identifies the paying agent. The offer-and-receipt extension lets the server "cryptographically commit to the payment terms it presents in" accepts[] (the payment terms of the offer, not the commercial terms of the sale) and sign a receipt; it says "Wire shape and field placement are not considered stable". The FAQ describes the exact scheme as a push payment, "irreversible once executed". Discovery (seam S1), read 2026-10-23: in the Domain Discovery working group of the x402 Foundation (x402-foundation/wg-domain-discovery) a verifier response schema was merged on 2026-10-02 (PR #6, proposal/verifier-schema.md); PR #8, open since 2026-10-11, proposes `/.well-known/x402` as a single canonical discovery path with a JSON schema, and issue #11, open since 2026-10-14, discusses the shape of that entry and its alignment with x402; in the core repository PR #2979, open since 2026-07-29, proposes DNS and `.well-known` records for facilitators. `/.well-known/x402`: not found in a GitHub code search of x402-foundation/x402 (default branch), 2026-10-23.

  '
boundary: The FAQ answers "Not natively." on credit-card deposits, placing fiat rails outside the protocol.
