id: a2a-discovery
name: A2A protocol, agent discovery
org: AAIF
kind: work-item
tier: core
status: 'A2A registers /.well-known/agent-card.json for a single AgentCard; proposals for hosts serving several agents (PR #2240, issues #2276 and #2248) were open on 2026-10-13: PR #2240 and issue #2248 have no comment, and issue #2276 has no comment after 2026-10-02.'
status_as_of: 2026-10-13
relevance: 'PR #2240 proposes /.well-known/ai-catalog.json as the "Preferred" discovery mechanism, and issue #2276 proposes /.well-known/agent-card-list.json for providers serving multiple agents. The documentation (docs/topics/agent-discovery.md on main) says "The current A2A specification does not prescribe a standard API for curated registries."; AI Catalog and Agentic Resource Discovery (ARD) not found in that file (2026-10-03). darrelmiller wrote on issue #1807 (2026-05-12) "Rather than layering trust information into the AgentCard, we are attempting to use AI Catalog to contain that kind of trust information." HTTP Archive custom-metrics PR #176, merged on 2026-10-07, adds a metric for "/.well-known/agent-card.json" to track its presence and key metadata.'
committed_next: []
boundary: 'A maintainer wrote on PR #418 that the A2A working group "will not be building any kind of registry standard".'
participation: 'The author of this map took part in issue #2276 (two comments, 2026-10-02); see Disclosure.'
