evidence:
  read: 'On 2026-11-23: Sierra''s post of 2026-11-13, "Releasing Personal Agent Protocol 1.0"; the minutes of the UCP Governing Council of 2026-11-13 (commit d00dd27, GitHub). On 2026-11-23, from the copies saved on 2026-11-16: specification 1.0 (sections 1 and 4.1), the operations extension at its unversioned address (page of version 1.0, section 8.1) and the changelog entries for 1.0. On 2026-11-16 (after version 1.5): the pages of version 0.1 at their versioned addresses, /docs/0.1/spec and /docs/0.1/extensions/operations, where the quotations of the relevance read on 2026-10-13 are found word for word (the unversioned addresses now serve version 1.0); and the Path to 1.0 page, now /docs/path-to-1, for the boundary. The content of version 1.0 was read on 2026-11-23 from the copies of 2026-11-16 (above). On 2026-11-16: the history of content/versions/versions.json in the specification''s repository (commits 4803900 and 8c02b42), the commit 8c02b42 (files changed), the releases and tags of the repository (none), the changelog page and the specification page of personalagentprotocol.org (redirect from /docs/spec to /docs/1.0/spec). Version 1.0 was published after Friday 2026-11-13 and enters as a correction of the state of a source already cited (patch level); its content is left to a later version. On 2026-11-09: the commits of the specification''s repository to 2026-11-06 (publication of 0.2 and 0.3), its Demos page at commit 2289293, Sierra''s landing page and blog sitemap (no post on PAP after 2026-10-09). On 2026-10-13: the specification, the operations extension, the extensions page, the Path to 1.0 page, the home page and the licence page of personalagentprotocol.org (each marked "Updated Oct 12, 2026" where the page carries a date), the Sierra blog of 2026-10-09, the Decagon blog of 2026-10-06 and the IANA well-known URI registry XML. On 2026-10-08: the Sierra announcement of 2026-10-06 in full, one trade article on it and one on the Shopify and Meta agreement. On 2026-11-23, datatracker record read for another entry of this version: draft-gunuganti-agent-approval-evidence-00 (2026-11-15), listed under open proposals. The relevance quoted until 2026-11-16 the operations extension of version 0.1, section 8 ("What a confirmation proves"): "It doesn''t prove that the User saw the terms or approved them."; that text is at /docs/0.1/extensions/operations. Removed from committed_next on 2026-11-23, as its date has passed: "Design workshops and a reference implementation "over the next month" (Sierra blog, 2026-10-09); on 2026-11-06 the reference implementation was not published and no public record of the workshops was found." (approx. 2026-11-09, source https://sierra.ai/blog/poppy). Status as written in version 1.5, kept verbatim as the record of earlier readings: "The content of 1.0 is not read for this entry.".'
  not_read: The sections of the specification beyond the discovery, agent identity, section 4.1 and approval texts quoted; the commerce extension, the implementation kit and its validator, the roadmap page, any Shopify page and any store's poppy.json; the PACT specification, any Meta publication on the protocol, the TechRepublic article on Meta's Muse (not retrievable on 2026-10-08).
  not_found: 'Not found, 2026-10-13: poppy.json in the IANA well-known URI registry XML; a standards body, foundation or working group in the pages of the site read (home, specification, extensions, operations, Path to 1.0, licence); UCP, A2A and Web Bot Auth in the same pages.'
