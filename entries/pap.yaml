id: pap
name: Personal Agent Protocol (PAP, "Poppy"), published by Sierra with Meta
org: Industry
kind: specification
tier: core
status: 'Draft 0.1 of the specification is published at personalagentprotocol.org (announced 2026-10-06, draft published 2026-10-09; the pages read on 2026-10-13 are marked "Updated Oct 12, 2026"), under the Apache License 2.0 with the names and the logo excluded; a further 35 design partners were named on 2026-10-09. Governance is worded two ways, not reconciled here. Sierra, 2026-10-06: "an open standard Meta and Sierra are developing along with industry partners at Genesys, Instinct, Rocket, Shopify, Stripe, and Walmart". Decagon, 2026-10-06: "join the Personal Agent Protocol working group announced by the team behind Meta''s Muse to help shape an industry standard". No standards body or governing organisation is named in the pages of the site read on 2026-10-13. Read 2026-11-09, as of 2026-11-06: in the specification''s repository (personal-agent-protocol/personal-agent-protocol, created 2026-10-14) version 0.2 was published on 2026-10-26 and version 0.3 on 2026-11-05, which opened draft 0.4; a reference implementation is not published by 2026-11-06, and the Demos page at the commit that published 0.3 lists demos "built by the community" that "have not been officially reviewed or endorsed by the Personal Agent Protocol authors or partners"; a public record of design workshops is not found (2026-11-09). Sierra''s landing page now says "40+ design partners". Read 2026-11-16: version 0.4 was published as the 1.0 release candidate (commit 4803900, 2026-11-11 02:36 UTC; the changelog page dates it November 10, 2026), and version 1.0 was published and frozen on 2026-11-14 (commit 8c02b42, "Publish and freeze 1.0", 15:12 UTC); the changelog page reads "Version 1.0 Published November 14, 2026" and the specification page at /docs/spec now redirects to /docs/1.0/spec, which reads "This is version 1.0."; the repository has no release or tag. The changelog describes version 1.0 as "0.4 with the fixes implementers needed" (read 2026-11-16). Sierra''s post "Releasing Personal Agent Protocol 1.0", dated 2026-11-13, a day before the changelog and commit dates, announces version 1.0 and states that "Shopify has enabled Poppy for every merchant on its platform"; this is Sierra''s statement, not checked against Shopify or any store; the post names an implementation kit with a validator, not a reference implementation (read 2026-11-23).'
status_as_of: 2026-11-23
relevance: 'Discovery is one well-known document: "A Company MUST publish its poppy.json document at https://{domain}/.well-known/poppy.json over HTTPS". The well-known URL "MAY redirect" to where the document is hosted, and "Personal Agents MUST follow redirects, and every redirect MUST be to an HTTPS URL"; the UCP specification says the opposite for its profile (see seam S1). poppy.json is not in the Internet Assigned Numbers Authority (IANA) well-known URI registry (not found in the registry XML, 2026-10-13). The agent is identified by a URL: "A Personal Agent''s client_id MUST be an HTTPS URL that returns its metadata document", which carries a jwks_uri and a token_endpoint_auth_method of private_key_jwt. Version 0.1 listed registering, allow-listing, blocking and revoking client ids; version 1.0 leaves the choice of agents to the Company: "A Company decides which Personal Agents it accepts, and how it approves them is outside this specification." (specification 1.0, section 4.1, read 2026-11-16). The operations extension (version 3, on the page of version 1.0), section 8.1 "What an approval proves", says that the Company relies on the Personal Agent for how an approval was given: "Accepting only user approvals still relies on the Personal Agent''s statement, and doesn''t show that the User approved."; signed user approvals are listed on the roadmap (read 2026-11-16). Sierra''s post of 2026-11-13 says that Shopify co-authored the protocol''s commerce extension, which links PAP and UCP; the extension itself was not read. The minutes of the UCP Governing Council of 2026-11-13 record that its members "agreed to explore any overlaps between PAP and UCP more closely to avoid fragmentation" (read 2026-11-23); see ucp. The announcement of 2026-10-06 says the protocol "defines how personal agents interact with businesses": it "starts on the website, where a personal agent can discover what the company offers and how to reach it", the session "is built on OAuth", and the customer decides whether the agent has read-only or write access. Context, not part of the protocol: Retail Insight Network reported on 2026-09-23 that Shopify and Meta partnered so that Meta''s assistant Muse can complete purchases across Shopify''s merchants through Shop Pay.'
committed_next:
- what: Retirement of the Mediated Sign-In extension, which the changelog of version 1.0 says the protocol plans for this date.
  when: 2027-03-17
  source: https://personalagentprotocol.org/docs/changelog
  class: statement
boundary: The Path to 1.0 page (read 2026-11-16) points to a roadmap of "the areas we expect to work on next, including the ones the spec doesn't cover yet, such as payments, push notifications, and attachments".
