id: mcp-server-card
name: MCP Server Cards (ext-server-card, SEP-2127)
org: AAIF
kind: specification
tier: core
status: 'Experimental extension of MCP: the README of the extension repository still reads "not an accepted or official MCP extension" (2026-10-13). SEP-2127 (PR #2127, "MCP Server Cards - HTTP Server Discovery", Extensions Track) was merged on 2026-10-06 (14:43 UTC, merge commit 0a11bf6) by a maintainer of the MCP repository; the Specification Enhancement Proposal (SEP) file, read 2026-10-13, carries "Status: Final" and says the full extension specification stays in the extension repository, graduating to a repository named ext-server-card on acceptance. The last commit of the extension repository on main is of 2026-08-12 (PR #47); latest activity read: issue #30 (2026-10-10, 9 comments).'
status_as_of: 2026-10-13
relevance: 'A Server Card is "a static metadata document that describes a remote MCP server enough for clients to discover and connect to it"; cards "intentionally omit primitive listings (tools, resources, prompts)". docs/discovery.md says clients performing domain-level discovery SHOULD attempt to retrieve /.well-known/ai-catalog.json, whose entries of type application/mcp-server-card+json point to the cards. Commerce metadata was kept out of the card: in issue #27 (closed 2026-06-13) a member of the modelcontextprotocol organisation (GitHub author association MEMBER, read 2026-10-13) answered "we do not intend to introduce MCP-specific patterns (like `_meta`) into the MCP Catalog"; SEP-2007 (payment support) was closed 2026-06-24 as "dormant".'
committed_next:
- what: 'Roadmap (PR #47, merged 2026-08-12): graduate the Server Card as an official MCP extension, then static primitives (#30) and authentication (#13).'
  when: undated
  source: https://github.com/modelcontextprotocol/ext-server-card/pull/47
  class: statement
- what: 'Notes of 2026-07-20: "Nested catalog and Link header features deferred to after release."'
  when: undated
  source: https://github.com/modelcontextprotocol/modelcontextprotocol/discussions/3115
  class: statement
boundary: The README says a Server Card "describes remote connectivity only"; local installation metadata stays in the MCP Registry server.json.
