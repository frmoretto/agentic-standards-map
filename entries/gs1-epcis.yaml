evidence:
  read: 'On 2026-10-30: the EPCIS PDF served at the 2.0.1 address (text extracted in full, 229 pages), quoted from sections 1, 12.8.3 and 12.8.3.4 and the query interface; the cover of the CBV 2.0.0 PDF; the OpenAPI document (paths and descriptions); the EPCIS and CBV archive pages and the artefacts page; the ontology landing page; the IEC webstore record; the GS1 Web Vocabulary JSON-LD (gs1:epcisRepository, gs1:epcis); the UNTP Digital Traceability Events page 0.7.0; workshop issues 31 and 15; the file listing, README and commit list of gs1/EPCIS; a GitHub search for EPCIS in the UCP repository (issues, pull requests, code) and in the ACP issues.'
  not_read: 'The pages of www.gs1.org on EPCIS and on public reviews (HTTP 403 to automated reads); the body of the CBV 2.0.0 PDF; the EPCIS and CBV implementation guideline; the XML and SOAP bindings; the examples at ref.gs1.org/docs/epcis; the content of the file in public_review_2_1.'
  not_found: 'Not found in the text of the EPCIS 2.0.1 PDF, 2026-10-30: agent (as a whole word). Not found in the UCP repository (issues, pull requests, code search) nor in the ACP issues, 2026-10-30: EPCIS.'
