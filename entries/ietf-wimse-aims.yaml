id: ietf-wimse-aims
name: IETF WIMSE, AI Identity Management System (draft-ietf-wimse-aims)
org: IETF
kind: work-item
tier: context
status: 'Working Group (WG) document draft-ietf-wimse-aims-01 (2026-11-02), expires 2027-05-06; Informational; adopted 2026-09-09; replaces draft-klrc-aiagent-auth. Revision -01 adds sections on long-lived sessions and streams and on interaction with policy-based systems ("A common policy language is therefore not required for the mechanisms in this document to interoperate across trust domains"; for an external policy decision point, "A common interface for that interaction is defined by the OpenID AuthZEN Authorization API"), makes deprovisioning an explicit stage of the lifecycle, and says that posture assessed at provisioning does not by itself establish that it still holds at the time of a request. The individual draft draft-zambo-aer1 (AER-1, revision -26 posted 2026-10-23; datatracker, read 2026-11-02) specifies "a small vocabulary for recording one AI agent tool call as a portable, independently checkable execution receipt"; it is not a WG document, and its author proposed it in issue #19 of this map''s repository. Its author publishes a conformance corpus at zambo.dev/aer1/corpus.json (format aer1-evaluated-corpus/1, kit 1.5.7, referring to draft-zambo-aer1-26, 143 vectors and 146 checks, with SHA-256 digests in the index; read 2026-11-03 and again 2026-11-09, unchanged); the index shows that the corpus exists, not that the checks pass, and its scripts were not run. A companion individual draft, draft-zambo-aer1-wimse-mapping, is at revision -02 of 2026-11-01 (datatracker, read 2026-11-09; text not read). The individual draft draft-hulea-wimse-agent-mandate-00 (2026-10-24, not a WG document) cites draft-ietf-wimse-aims and defines how a relying party in one administrative domain validates the mandate under which an agent acts for a principal in another domain, adding evidence that the delegator was entitled to grant it, kept separate from the grant itself; its examples include an agent initiating a payment at a bank (text read 2026-11-02; revision -01 of 2026-11-01 is on the datatracker, read 2026-11-09, and its text was not read for this map).'
status_as_of: 2026-11-09
relevance: 'The draft "proposes best practices for authentication and authorization of AI agent interactions"; commerce, merchant, seller or purchase text: not found in -00, 2026-10-02. ACP and AP2 appear only in the references.'
