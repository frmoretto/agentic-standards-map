id: lf-ai-catalog
name: AI Catalog (Agent Card Working Group)
org: Linux Foundation
kind: specification
tier: core
status: 'Pre-v1 specification in "a temporary working repo maintained by the Linux Foundation", governed by a Technical Steering Committee with four initial seats. The well-known path is optional by design (ADR-0011). On 2026-10-13 the README of main still says "This is a temporary working repo maintained by the Linux Foundation" and "This project will be moved to a permanent location a later date with a permanent governance model."; the last commit of main is of 2026-10-08 (PR #119, implementation classifications); issue #46 (project location) was closed as completed on 2026-10-03 without a comment. PR #110 (did:web verification of signed Entry Trust Manifests) was merged on 2026-10-01.'
status_as_of: 2026-10-13
relevance: 'ADR-0011 (accepted 2026-04-02) says a well-known URI "should be registered as a conventional discovery location" but "is not mandatory", so catalogues may be served from any URL. Publisher identity is the most developed theme: urn:air anchored to a domain and did:web verification of signed trust manifests (PR #110, merged 2026-10-01), whose text says "This establishes publisher-domain control, not publisher reputation." Terms of service and privacy policy URLs are fields of the trust manifest (termsOfServiceUrl, privacyPolicyUrl); the maintainers'' wording on Agentic Resource Discovery (ARD) is "Documents the decision to loosely couple ARD and AI-Catalog" (PR #77).'
