id: w3c-agent-identity-registry-cg
name: W3C Agent Identity Registry Protocol Community Group
org: W3C
kind: venue
tier: context
status: 'Community group created 2026-04-24; calls every two weeks on Tuesdays at 15:00 UTC; the call of 2026-10-06 had an agenda on the list (message of 2026-10-01) and minutes of 22 September were posted on 2026-10-01; the minutes of the call of 2026-10-06 were posted on the list on 2026-10-16 (read 2026-11-23). The W3C group data list one chair. Read 2026-11-02: the group''s repository w3c-cg/agent-identity holds agendas and minutes for 2026-09-08, 2026-09-22, 2026-10-06 and 2026-10-20; the minutes of 2026-10-20 (added on 2026-10-29) record a demonstration of credential registration and scope authorization by the chair, no resolutions, and the circulation of a landscape document. The call of 2026-11-17 was held: the chair wrote on 2026-11-19 that the notes were still being prepared, and no minutes for it are in the repository on 2026-11-23; its agenda included a receiver test matrix reviewed under FC-02, for which "Pass conditions are fixed before any run.", and the approval of the landscape document; the next call is announced for 2026-12-01 (read 2026-11-23).'
status_as_of: 2026-11-23
relevance: Develops specifications to verify an agent's identity, controlling entity and authorization scope; the chair wrote on 2026-08-26 "We'll keep this group focused on the registry and credential layer for now".
participation: 'The author of this map took part in the group''s mailing list: a reply on the fields of the landscape document (2026-10-26), and two messages of 2026-11-12 and 2026-11-13 in the thread "DNS vs DID in the Trust Layer", the second proposing a column for who publishes the key set a verifier trusts; on 2026-11-15 the trust record of the AIKR Community Group added it as a proposed field, "Key publisher"; see Disclosure.'
