  read: 'On 2026-11-09: the approved charter page (the sentence in the boundary), the datatracker records of the drafts named above (revisions and dates), a name search for draft-ietf-dawn (none) and the DAWN agenda for IETF 127 (revision -07 of 2026-11-06). Not read: the Area Director''s message "About the DAWN charter" of 2026-11-02 on the DAWN list (mailarchive.ietf.org is not read by this map); the boundary quotes the approved charter instead. On 2026-11-02: the datatracker records of draft-jakab-dawn-agent-discovery-mdns (-01), draft-king-dawn-requirements (-02) and a name search for draft-ietf-dawn (none); the texts of draft-artamokhov-dawn-marketplace-discovery-01, draft-artamokhov-dawn-index-federation-01 and draft-dinuzzo-best-protocol-02 (status, abstract, well-known URIs, implementation status). On 2026-10-26: the agenda of IETF 127 on the datatracker (agenda.json: day, time and room of the dawn session) and the meeting record (time zone America/Los_Angeles). On 2026-10-23: issue #18 on this map''s repository, proposing the sentence on draft-jakab-dawn-agent-discovery-mdns-00, whose proposer wrote "author, with Frank Brockners; both employed by Cisco. Frank Brockners became a DAWN WG chair on 2026-10-22."; the datatracker page of that draft (title, revision, date, expiry, authors, abstract). On 2026-10-23: the datatracker group page and group history of dawn, the charter page (charter-ietf-dawn-01, approved, text in full) and the charter history; the datatracker pages of the four other drafts named in the relevance, draft-jimenez-dawn-discovery-landscape, draft-zhang-dawn-agent-discovery-framework, draft-moussa-dawn-gap-analysis and draft-kay-dawn-use-cases (revision, date, state, stream) and a name search for "dawn" (no draft-ietf-dawn document). On 2026-10-16: the datatracker page and the text of draft-zhang-dawn-agent-discovery-framework-07 (individual, no stream); the two-layer federated architecture is in the text. On 2026-10-14: the datatracker charter page and the ballot page of charter-ietf-dawn-00-10 (summary, positions) and the WG Review announcement (chairs). The datatracker charter, WG and charter history pages, the WG Review announcement on ietf-announce and the ietf-announce list up to 2026-10-12, and the DAWN list message of 2026-10-12 to the IESG, read 2026-10-13. The ballot and list messages of the dawn list from 2026-09-24 to 2026-10-07 (39 messages, read without quoted replies), read 2026-10-08. Charter 00-08 text, ballot and history pages, read 2026-10-03; the dawn list, 2026-08-01 to 2026-10-02 (200 messages, read without quoted replies).'
