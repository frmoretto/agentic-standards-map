id: ietf-dawn
name: IETF DAWN, Discovery of Agents With Names (working group)
org: IETF
kind: charter
tier: core
status: 'The IESG approved the DAWN charter on 2026-10-22 and the Working Group (WG) is active: the datatracker group history of that day records "Charter approved, group active", and the group page lists the approved charter as charter-ietf-dawn-01, posted on 2026-10-22 after charter revisions 00-11 and 00-12 (read 2026-10-23). Chairs: Dapeng Liu and Frank Brockners; technical advisor: Kehan Yao; Area Director: Éric Vyncke (Internet Area). The group history records "Chair changed to Dapeng Liu, Frank Brockners from Adrian Farrel, Wes Hardaker": Adrian Farrel and Wes Hardaker chaired the group while it was a BoF and a proposed WG, and were named as chairs of the proposed WG in the WG Review announcement of 2026-10-09. The approved charter says: "The DAWN working group will coordinate with WIMSE and OAUTH WGs as well as other WGs related to DNS (e.g., DNSSD), discovery, identities, or AI (e.g., AGENTPROTO). It will also coordinate with external standards bodies as necessary." Before the approval: the group changed from BoF to Proposed on 2026-08-24; charter 00-09 was on the IESG ballot in early October; charter 00-10 was in external review from 2026-10-09, with comments to the IESG due by 2026-10-19, and was on the agenda of the IESG telechat of 2026-10-22; on 2026-10-22 the "Approve" ballot was closed and the charter state changed to Approved.'
status_as_of: 2026-11-09
relevance: 'DAWN is chartered to standardise how a client discovers "public properties of AI resources", so it is the IETF venue where a seller''s agent surface would be found. The charter gives three deployment contexts with one example each (approved charter charter-ietf-dawn-01, read on the datatracker on 2026-10-23; the same examples as in charter 00-10): for the local network "within the local network, e.g., discover all agents in this shop;", and for the public Internet "between cooperating parties with trust relationships over the public Internet, e.g., discover all agents of example.org, for all its customers/members.". The WG "will also specify the minimum public discovery information (e.g., type, reachability information, communication protocol, services)."; commerce as a scope item: not found in the approved charter charter-ietf-dawn-01, read 2026-10-23 (commerce, merchant, transaction, payment and purchase do not occur; "shop" occurs once, in the local network example "within the local network, e.g., discover all agents in this shop;"), nor in charter 00-10 (2026-10-13) and charter 00-08 (2026-10-03). On 2026-10-05 the INT Area Director wrote, on a request for a non-WG mailing list for DNS records under underscore labels that carry keys, key commitments or references to them, "While a mailing list will be created, I would like to push back on its name as it misses link to DNS"; the requester proposed the name dns-underscore-keys. An individual survey, draft-jimenez-dawn-discovery-landscape-00 (2026-07-03), compares discovery mechanisms from the IETF, AAIF, 3GPP and open-source projects and lists eight gaps, among them "Well-Known Namespace Pressure"; a text search of it finds no occurrence of AI Catalog, Agentic Resource Discovery (ARD), UCP or commerce (2026-10-06). The individual draft draft-zhang-dawn-agent-discovery-framework proposed a two-layer federated architecture in revision -07 (2026-10-15, text read 2026-10-16); revisions -08 (2026-10-19) and -09 (2026-10-21) followed, and the text of -09 was not read (datatracker, 2026-10-23). The individual draft draft-jakab-dawn-agent-discovery-mdns (revision -00 of 2026-07-06; revision -01 of 2026-10-28, datatracker, read 2026-11-02) describes how Multicast DNS (mDNS) and DNS-Based Service Discovery (DNS-SD) can be used to advertise and discover agents on a local link; it is an individual Internet-Draft, not a document of the WG, and one of its two authors, Frank Brockners, has been a chair of DAWN since 2026-10-22. A second individual draft, draft-moussa-dawn-gap-analysis-01 (Moussa, Akhavain, 2026-06-12), is a gap analysis and applicability statement that maps existing discovery mechanisms to the DAWN problem statement and requirements; a text search of it finds no occurrence of AI Catalog, ARD, UCP or commerce (2026-10-06). The individual draft draft-kay-dawn-use-cases-01 (2026-09-10) names Agentic Resource Discovery as a possible interface to a provider''s catalogue in a broadcast use case and adds: "ARD is an illustrative option; protocol choice remains open." The IETF Chair announced on 2026-10-02 that an INT Area Director resigned from the IESG as of 2026-10-01 and that the other co-AD for the INT area is the primary point of contact for the area; the datatracker lists that Area Director as responsible Area Director (AD) for DAWN (2026-10-03). On 2026-10-07 an IESG member entered a Yes with comments on 00-09 that asked the charter to say that the protocol specifications normatively define the minimum discovery information, that the WG is "expected to converge on one mechanism per deployment context", and that "discovering where a catalog is lives in DAWN, and what a catalog contains doesn''t"; the member also asked whether DAWN defines how agents are named, and that DNSSD, DNSOP and AgentProto be named in the coordination text. The approved charter names DNSSD and AGENTPROTO in its coordination text and does not name DNSOP; the two quoted sentences are not in it (read 2026-10-23). On the list thread "DAWN Coordination: Discovery Information and Trust Artifact Pointers" Girish Konda wrote on 2026-10-07 that a reference that does not resolve, one blocked by the discovering entity''s own retrieval policy, and one that resolves with the record absent are three causes: "All three end as no discovery result, and they have different owners and different retries." On 2026-10-12 a participant who states that they are a co-author of three individual drafts in this space wrote to the IESG on the DAWN list in reply to the WG Review thread "I support chartering DAWN as written in charter-ietf-dawn-00-10", and gave as a reason for keeping identity management of agents out of the first phase "Discovery has to work before anyone argues about who the discovered thing is". Individual drafts read on 2026-11-02 (datatracker and text): draft-king-dawn-requirements-02 (2026-10-19) defines requirements for DAWN; draft-artamokhov-dawn-marketplace-discovery-01 (2026-10-30, intended Standards Track) defines a JSON discovery document at the well-known URI /.well-known/agent-marketplace that points to a capability index''s signed catalogue, and its implementation status section lists a reference implementation on six indexes "operated by the author or affiliated parties" and further implementations by the same author; draft-artamokhov-dawn-index-federation-01 (2026-10-30, Experimental) describes how such indexes discover and admit each other and says "No implementation of this document by another party is known."; draft-dinuzzo-best-protocol-02 (2026-10-30, Informational) has services describe their commands and events through a manifest at "/.well-known/best". None of them is a WG document, and none is counted among the discovery paths on the home page. Later revisions on the datatracker (read 2026-11-09; texts not read): marketplace-discovery -02 and -03 (2026-11-02), best-protocol -03 (2026-11-02); index-federation is still at -01. Further individual drafts on the DAWN agenda for IETF 127 (agenda revision -07, 2026-11-06): draft-farrel-dawn-terminology-07 (2026-11-02), "terminology for Discovery of Agents With Names (DAWN)"; draft-cui-dawn-mdi-model-02 (2026-11-02, after -01 of 2026-11-01); draft-seethiraju-dawn-dan-01 (2026-10-30), DNS resource records AIDISCA and AIINDEX for agent discovery; and the three ARD drafts of 2026-10-30 (see `ard`). Working group documents: none on 2026-10-23, none on 2026-11-02, none on 2026-11-09 (datatracker). The datatracker lists no draft-ietf-dawn document; every draft named in this entry is an individual Internet-Draft with no stream, and none has been adopted by the WG.'
