evidence:
  read: 'On 2026-10-18: the Google blog post of 2026-04-28 ("Google donates Agent Payments Protocol to FIDO Alliance"), the FIDO release of 2026-04-28 and docs/index.md on main. On 2026-10-13: the release list (latest v0.2.0, 2026-04-28), the head of main (commit e1ea56d, 2026-04-29, unchanged since the reading of 2026-10-05), docs/index.md, docs/ap2/agent_authorization.md, checkout_receipt.json and receipt_status.json at that commit, and issue #374,. Also on 2026-10-13, at the same commit: docs/ap2/specification.md (section Checkout Mandate, which holds the sentence "Once the Merchant has accepted or rejected the Checkout Mandate, it MUST return a Checkout Receipt."), flows.md (receipt passages), the Checkout Receipt section of checkout_mandate.md (which holds the schema fields), and a search of the seven documents of docs/ap2 for the words refund, cancel and fulfil(l), recounted on 2026-10-14. google-agentic-commerce/AP2, 2026-10-03: metadata, releases v0.2.0 and v0.1.0, README, CONTRIBUTING.md, docs/index.md, docs/faq.md; FIDO release of 2026-04-28 and blog of 2026-05-26, in full; at commit e1ea56d on 2026-10-05: docs/ap2/specification.md, docs/ap2/agent_authorization.md and code/sdk/schemas/ap2/checkout_receipt.json.'
  not_read: The mandate pages checkout_mandate.md and payment_mandate.md beyond the receipt sections, other code, commits, issues, FIDO working group charters.
  not_found: 'Not found in the seven documents of docs/ap2 at commit e1ea56d (agent_authorization, checkout_mandate, flows, implementation_considerations, payment_mandate, security_and_privacy_considerations, specification), 2026-10-14: refund and cancel (0 occurrences each).'
matrix:
  governance: FIDO Alliance (donated by Google, 2026-04-28; Payments and Agentic Authentication TWGs); reference repository in the organisation google-agentic-commerce, Apache-2.0
  version_state: v0.2.0 (2026-04-28), v0.1.0 (2025-09-16); standardisation continues in FIDO working groups
  signs: 'Mandates (signed Verifiable Digital Credentials): Checkout Mandate (shared with merchant), Payment Mandate (instrument, amount)'
  signer: 'Closed mandates: the User (Human Present) or an Agent key (Human Not Present), whose trust "is provided by open Mandates that are signed by the User or a trust list of Agent Providers"; the Merchant provides "a merchant-signed JWT containing the Checkout" (docs/ap2/specification.md, Modes and Checkout Mandate, commit e1ea56d, 2026-10-05); FAQ: "user-signed Checkout Mandate"'
  record: Checkout Receipt, returned by the Merchant after accepting or rejecting the Checkout Mandate, with fields status (Success or Error), iss, iat, reference (hash of the closed Mandate) and order_id on Success (checkout_receipt.json); a Mandate Receipt is "a Verifier-signed JWT" (agent_authorization.md); a "signed Payment Receipt" is returned by the Merchant Payment Processor (specification.md); all at commit e1ea56d, 2026-10-05; chained mandates give a verifiable audit trail (docs/index.md)
  dispute: 'FAQ: in a dispute the network adjudicator can use the user-signed Checkout Mandate; dispute process: "outside the scope of this specification" (docs/ap2/specification.md, section Dispute Evidence, commit e1ea56d, read 2026-10-14)'
  source: https://github.com/google-agentic-commerce/AP2/blob/main/docs/index.md
open_proposals:
- what: 'Issue #374: the Mandate Receipt is described with a `result` field of `["success", "error"]` (docs/ap2/agent_authorization.md, lines 503 to 516) and with a `status` field of `Success` or `Error` (code/sdk/schemas/ap2/checkout_receipt.json and types/receipt_status.json), both read at commit e1ea56d; no comment on the issue on 2026-10-13.'
  author: a participant
