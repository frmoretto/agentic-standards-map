id: a2a-core
name: Agent2Agent (A2A) protocol, core specification
org: AAIF
kind: specification
tier: context
status: 'Hosted project of the Agentic AI Foundation (AAIF, under the Linux Foundation): the AAIF announced on 2026-08-17 that A2A "is joining the Agentic AI Foundation (AAIF) as a hosted project", and the A2A blog of 2026-08-27 says it was "accepted as a Growth Stage project". Latest release v1.0.1, 2026-05-28. Technical Steering Committee of eight company seats: Google, Microsoft, Cisco, AWS, Salesforce, ServiceNow, SAP, IBM.'
status_as_of: 2026-10-18
relevance: 'The AgentCard is defined in specification/a2a.proto as "A self-describing manifest for an agent."; how cards are found is in a2a-discovery. PR #2081, merged on 2026-07-30, added section 7.6.4 to the specification: "Agents MUST NOT treat the TASK_STATE_AUTH_REQUIRED state transition, by itself, as authorization for any particular operation."; the PR description calls the state "a coordination signal, not an authorization grant".'
